"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its fields be provided).
"""
directive @oneOf on INPUT_OBJECT

type AllocationInventory implements Inventory{
	available: Int!
	capacity: Int
	id: String
	type: InventoryKind!
}

"""
## Inventory
            Represents the inventory for an item, multiple types of inventory exist:
            
            * `FreeSellInventory`
            * `AllocationInventory`
            * `OnRequestInventory`
            
            All of which respond to the `type` field
"""
interface Inventory {
"""
## Inventory
            Represents the inventory for an item, multiple types of inventory exist:
            
            * `FreeSellInventory`
            * `AllocationInventory`
            * `OnRequestInventory`
            
            All of which respond to the `type` field
"""
	type: InventoryKind!
}

"""
Product Inventory Kind
"""
enum InventoryKind {
"""
Free-sell product / unlimited inventory
"""
	FREE_SELL
"""
Pre-allocated inventory. Use `available` to determine stock
"""
	ALLOCATION
"""
Product may be sold but out-of-band verification of inventory is required
                    The value of `errata` should provide details of the verification required
"""
	ON_REQUEST
}

type FreeSellInventory implements Inventory{
	type: InventoryKind!
}

type OnRequestInventory implements Inventory{
	errata: String!
	type: InventoryKind!
}

